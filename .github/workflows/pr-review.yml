name: Claude Auto Review

on:
  pull_request:
    types: [opened, synchronize]
  workflow_call:
    inputs:
      model:
        description: "Primary model passed to claude-code-action"
        type: string
        default: "nvidia/nemotron-3-ultra-550b-a55b:free"
        required: false
      model_fallback:
        description: "Fallback model used if the primary model's review step fails"
        type: string
        default: "poolside/laguna-s-2.1:free"
        required: false
      allowed_tools:
        description: "Comma-separated allowedTools for claude-code-action"
        type: string
        default: "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr review:*),Bash(git diff:*),Bash(git log:*),Bash(gh api graphql:*)"
        required: false
    secrets:
      OPENROUTER_API_KEY:
        required: true

jobs:
  review:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine previously reviewed commit
        id: prev_review
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          previous_sha=$(gh pr view "$PR_NUMBER" \
            --json reviews \
            --jq '[.reviews[] | select(.body | test("^AI_REVIEW_(PASSED|BLOCKING)@[0-9a-f]{7,40}$"))] | last | (.body // "") | sub("^AI_REVIEW_(PASSED|BLOCKING)@"; "")')

          # Only usable if that commit is still an ancestor of the current head
          # (handles force-pushes/rebases where it would no longer apply).
          if [ -n "$previous_sha" ] && git merge-base --is-ancestor "$previous_sha" "$HEAD_SHA" 2>/dev/null; then
            echo "previous_sha=$previous_sha" >> "$GITHUB_OUTPUT"
            echo "Found previous reviewed commit: $previous_sha"
          else
            previous_sha=""
            echo "previous_sha=" >> "$GITHUB_OUTPUT"
            echo "No usable previous reviewed commit found - will review the full PR diff"
          fi

          # Decide deterministically (no model judgement involved) whether there is
          # anything new to review at all. Without this, a re-run (or any trigger)
          # with no actual code change since the last review would still invoke the
          # model, which may not reliably recognize "nothing changed" on its own and
          # could re-review the whole PR from scratch, re-posting old findings.
          if [ -z "$previous_sha" ]; then
            echo "has_new_changes=true" >> "$GITHUB_OUTPUT"
            echo "No previous review - first-time review, has_new_changes=true"
          elif [ -n "$(git diff --name-only "$previous_sha" "$HEAD_SHA")" ]; then
            echo "has_new_changes=true" >> "$GITHUB_OUTPUT"
            echo "Code changed since $previous_sha - has_new_changes=true"
          else
            echo "has_new_changes=false" >> "$GITHUB_OUTPUT"
            echo "No code changes since $previous_sha (same commit, or an empty/no-op diff) - has_new_changes=false, skipping review"
          fi

      - name: Review PR (primary model)
        id: review_primary
        if: steps.prev_review.outputs.has_new_changes == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        env: &review_env
          ANTHROPIC_BASE_URL: https://openrouter.ai/api
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ""

        with:
          anthropic_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          show_full_output: false

          prompt: &review_prompt |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            CURRENT HEAD COMMIT: ${{ github.event.pull_request.head.sha }}
            PREVIOUSLY REVIEWED COMMIT: ${{ steps.prev_review.outputs.previous_sha }}

            If PREVIOUSLY REVIEWED COMMIT is non-empty, this PR was already reviewed up through
            that commit in an earlier run. Get ONLY the incremental changes since then with:

              git diff ${{ steps.prev_review.outputs.previous_sha }} ${{ github.event.pull_request.head.sha }}

            and review ONLY that incremental diff. Do not re-report findings about code that falls
            outside this incremental diff, even if it is still part of the overall PR - it was already
            reviewed in a previous run and either accepted or is a pre-existing issue already raised.

            If PREVIOUSLY REVIEWED COMMIT is empty, this is the first review of this PR - use
            `gh pr diff` to review the entire PR diff as usual.

            Focus on:
            - bugs and incorrect logic
            - security vulnerabilities
            - race conditions
            - runtime errors
            - breaking changes
            - database and migration risks

            For every issue found, the inline comment MUST include:
            1. What is wrong
            2. Why it is a problem
            3. A concrete solution
            4. A corrected code example when possible

            Use `mcp__github_inline_comment__create_inline_comment`
            with `confirmed: true` to post the issue directly on the relevant code.

            Do not only describe the problem. Always explain exactly how to fix it.

            BEFORE posting any new inline comment, do this first:

            1. Fetch this PR's EXISTING review threads:

               gh api graphql -f query='
               query {
                 repository(owner: "${{ github.repository_owner }}", name: "${{ github.event.repository.name }}") {
                   pullRequest(number: ${{ github.event.pull_request.number }}) {
                     reviewThreads(first: 100) {
                       nodes {
                         id
                         isResolved
                         path
                         line
                         comments(first: 1) { nodes { body } }
                       }
                     }
                   }
                 }
               }'

            2. For each thread where isResolved is false, read its comment body to understand what
               issue was raised, then look at the CURRENT full content of the file it points to
               (not just the incremental diff - the issue may have been fixed on a nearby line, not
               necessarily the exact anchored line) to judge whether that specific issue is actually
               fixed now.

               - If it IS fixed: resolve it with
                 gh api graphql -f query='
                 mutation {
                   resolveReviewThread(input: {threadId: "<thread id from step 1>"}) {
                     thread { isResolved }
                   }
                 }'
               - If it is NOT fixed, or you are not confident: take NO action on it at all. Do not
                 resolve it, and - this is important - do NOT post any new comment about it either,
                 not even to say it's "still unfixed" or "confirmed not fixed". A thread you leave
                 unresolved already communicates "still open" by itself; a second comment repeating
                 the same finding is a duplicate, not new information, and must not be created.

            Do this check for every unresolved thread on the PR, not only ones touching the diff you
            are about to review below - this step must happen regardless of whether that diff is
            empty, trivial, or substantial.

            ONLY AFTER that: review the incremental diff for genuinely new issues, following these
            rules strictly:

            - Before posting a new comment about an issue, compare it against the EXISTING unresolved
              threads you just fetched above (by file and by the substance of the issue, not just by
              exact line number, since a later commit can shift what's on which line). If an existing
              unresolved thread already describes the same underlying issue - anywhere in the file,
              not only on the exact line you'd otherwise comment on - do NOT post a new comment for
              it. It is already tracked; posting again creates a duplicate.
            - Only post a new comment for an issue that has no existing open thread describing it
              anywhere in the PR.

            If you find one or more significant issues (in the diff you were told to review above)
            that should block merging, you MUST finish by running:

            gh pr review ${{ github.event.pull_request.number }} --request-changes --body "AI_REVIEW_BLOCKING@${{ github.event.pull_request.head.sha }}"

            If you find no significant blocking issues, you MUST finish by running:

            gh pr review ${{ github.event.pull_request.number }} --comment --body "AI_REVIEW_PASSED@${{ github.event.pull_request.head.sha }}"

            Do not finish without submitting exactly one of these two verdicts, and use the exact
            commit SHA shown above (CURRENT HEAD COMMIT) in the verdict body - do not substitute a
            different SHA.

          claude_args: |
            --model ${{ inputs.model || 'nvidia/nemotron-3-ultra-550b-a55b:free' }}
            --allowedTools "${{ inputs.allowed_tools || 'mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr review:*),Bash(git diff:*),Bash(git log:*),Bash(gh api graphql:*)' }}"

      - name: Review PR (fallback model)
        if: steps.prev_review.outputs.has_new_changes == 'true' && steps.review_primary.outcome != 'success'
        uses: anthropics/claude-code-action@v1
        env: *review_env

        with:
          anthropic_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          show_full_output: false

          prompt: *review_prompt

          claude_args: |
            --model ${{ inputs.model_fallback || 'poolside/laguna-s-2.1:free' }}
            --allowedTools "${{ inputs.allowed_tools || 'mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr review:*),Bash(git diff:*),Bash(git log:*),Bash(gh api graphql:*)' }}"

      - name: Enforce AI review verdict
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          verdict=$(gh pr view "$PR_NUMBER" \
            --json reviews \
            --jq '[.reviews[] | select(.body | test("^AI_REVIEW_(PASSED|BLOCKING)@[0-9a-f]{7,40}$"))] | last | .body')

          echo "AI verdict: $verdict"

          if [[ "$verdict" == AI_REVIEW_BLOCKING@* ]]; then
            echo "::error::AI review found blocking issues"
            exit 1
          fi

          if [[ "$verdict" != AI_REVIEW_PASSED@* ]]; then
            echo "::error::AI reviewer did not submit a valid verdict"
            exit 1
          fi

          echo "AI review passed"
